server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=usuario-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USUARIO-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/usuario-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=personaje-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PERSONAJE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/personaje-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1