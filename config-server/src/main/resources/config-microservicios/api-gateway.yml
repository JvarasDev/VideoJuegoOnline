# ─────────────────────────────────────────────────────────────
# CONFIGURACIÓN SENIOR - VIDEOJUEGO ONLINE
# ─────────────────────────────────────────────────────────────
server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      
      # Rutas de los 9 Microservicios Reales
      routes:
        - id: arma-service
          uri: lb://arma-service
          predicates:
            - Path=/api/armas/**

        - id: combate-service
          uri: lb://combate-service
          predicates:
            - Path=/api/combates/**

        - id: inventario-service
          uri: lb://inventario-service
          predicates:
            - Path=/api/inventarios/**, /api/items-inventario/**

        - id: mision-service
          uri: lb://mision-service
          predicates:
            - Path=/api/misiones/**

        - id: pago-service
          uri: lb://pago-service
          predicates:
            - Path=/api/pagos/**

        - id: personaje-service
          uri: lb://personaje-service
          predicates:
            - Path=/api/personajes/**

        - id: ranking-service
          uri: lb://ranking-service
          predicates:
            - Path=/api/rankings/**

        - id: tienda-service
          uri: lb://tienda-service
          predicates:
            - Path=/api/productos/**

        - id: usuario-service
          uri: lb://usuario-service
          predicates:
            - Path=/api/usuarios/**

        - id: arma-docs
          uri: lb://arma-service
          predicates:
            - Path=/v3/api-docs/arma-service
          filters:
            - RewritePath=/v3/api-docs/arma-service, /v3/api-docs

        - id: combate-docs
          uri: lb://combate-service
          predicates:
            - Path=/v3/api-docs/combate-service
          filters:
            - RewritePath=/v3/api-docs/combate-service, /v3/api-docs

        - id: inventario-docs
          uri: lb://inventario-service
          predicates:
            - Path=/v3/api-docs/inventario-service
          filters:
            - RewritePath=/v3/api-docs/inventario-service, /v3/api-docs

        - id: mision-docs
          uri: lb://mision-service
          predicates:
            - Path=/v3/api-docs/mision-service
          filters:
            - RewritePath=/v3/api-docs/mision-service, /v3/api-docs

        - id: pago-docs
          uri: lb://pago-service
          predicates:
            - Path=/v3/api-docs/pago-service
          filters:
            - RewritePath=/v3/api-docs/pago-service, /v3/api-docs

        - id: personaje-docs
          uri: lb://personaje-service
          predicates:
            - Path=/v3/api-docs/personaje-service
          filters:
            - RewritePath=/v3/api-docs/personaje-service, /v3/api-docs

        - id: ranking-docs
          uri: lb://ranking-service
          predicates:
            - Path=/v3/api-docs/ranking-service
          filters:
            - RewritePath=/v3/api-docs/ranking-service, /v3/api-docs

        - id: tienda-docs
          uri: lb://tienda-service
          predicates:
            - Path=/v3/api-docs/tienda-service
          filters:
            - RewritePath=/v3/api-docs/tienda-service, /v3/api-docs

        - id: usuario-docs
          uri: lb://usuario-service
          predicates:
            - Path=/v3/api-docs/usuario-service
          filters:
            - RewritePath=/v3/api-docs/usuario-service, /v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    custom-css-url: /theme-jsoc.css
    urls:
      - name: 01. Arma Service
        url: /v3/api-docs/arma-service
      - name: 02. Combate Service
        url: /v3/api-docs/combate-service
      - name: 03. Inventario Service
        url: /v3/api-docs/inventario-service
      - name: 04. Mision Service
        url: /v3/api-docs/mision-service
      - name: 05. Pago Service
        url: /v3/api-docs/pago-service
      - name: 06. Personaje Service
        url: /v3/api-docs/personaje-service
      - name: 07. Ranking Service
        url: /v3/api-docs/ranking-service
      - name: 08. Tienda Service
        url: /v3/api-docs/tienda-service
      - name: 09. Usuario Service
        url: /v3/api-docs/usuario-service

eureka:
  client:
    register-with-eureka: true
    registry-fetch-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: TRACE
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
    com.netflix.discovery: DEBUG

---
spring:
  config:
    activate:
      on-profile: local
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
