spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # classpath: → empaquetado dentro del JAR → funciona con mvn spring-boot:run y en Docker
          # file:      → volumen Docker montado → permite sobreescribir sin rebuild (override opcional)
          search-locations:
            - classpath:/config-microservicios/
            - file:/config-microservicios/

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.config: DEBUG

---
# Perfil docker: la ruta de configuración se monta via volumen en el contenedor
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      server:
        native:
          # En Docker el volumen sobreescribe el classpath → permite hot-reload sin rebuild
          search-locations:
            - classpath:/config-microservicios/
            - file:/config-microservicios/
