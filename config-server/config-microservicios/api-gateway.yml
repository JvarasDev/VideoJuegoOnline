# ─────────────────────────────────────────────────────────────
# CONFIGURACIÓN SENIOR - VIDEOJUEGO ONLINE
# ─────────────────────────────────────────────────────────────
server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      
      # Rutas de los 9 Microservicios Reales
      routes:
        - id: arma-service
          uri: lb://arma-service
          predicates: [- Path=/arma-service/**, /api/armas/**]
          filters: [StripPrefix=1]

        - id: combate-service
          uri: lb://combate-service
          predicates: [- Path=/combate-service/**, /api/combates/**]
          filters: [StripPrefix=1]

        - id: inventario-service
          uri: lb://inventario-service
          predicates: [- Path=/inventario-service/**, /api/inventarios/**, /api/items-inventario/**]
          filters: [StripPrefix=1]

        - id: mision-service
          uri: lb://mision-service
          predicates: [- Path=/mision-service/**, /api/misiones/**]
          filters: [StripPrefix=1]

        - id: pago-service
          uri: lb://pago-service
          predicates: [- Path=/pago-service/**, /api/pagos/**]
          filters: [StripPrefix=1]

        - id: personaje-service
          uri: lb://personaje-service
          predicates: [- Path=/personaje-service/**, /api/personajes/**]
          filters: [StripPrefix=1]

        - id: ranking-service
          uri: lb://ranking-service
          predicates: [- Path=/ranking-service/**, /api/rankings/**]
          filters: [StripPrefix=1]

        - id: tienda-service
          uri: lb://tienda-service
          predicates: [- Path=/tienda-service/**, /api/productos/**]
          filters: [StripPrefix=1]

        - id: usuario-service
          uri: lb://usuario-service
          predicates: [- Path=/usuario-service/**, /api/usuarios/**]
          filters: [StripPrefix=1]

        # Redirección dinámica de API Docs para cada servicio
        - id: openapi-docs
          uri: lb://{{service}}
          predicates:
            - Path=/v3/api-docs/{service}
          filters:
            - RewritePath=/v3/api-docs/(?<service>.*), /v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 01. Arma Service
        url: /v3/api-docs/arma-service
      - name: 02. Combate Service
        url: /v3/api-docs/combate-service
      - name: 03. Inventario Service
        url: /v3/api-docs/inventario-service
      - name: 04. Mision Service
        url: /v3/api-docs/mision-service
      - name: 05. Pago Service
        url: /v3/api-docs/pago-service
      - name: 06. Personaje Service
        url: /v3/api-docs/personaje-service
      - name: 07. Ranking Service
        url: /v3/api-docs/ranking-service
      - name: 08. Tienda Service
        url: /v3/api-docs/tienda-service
      - name: 09. Usuario Service
        url: /v3/api-docs/usuario-service

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
