spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888

---
# ✅ Perfil docker: config-server y eureka se resuelven por nombre de servicio Docker
spring:
  config:
    activate:
      on-profile: docker
    import: optional:configserver:http://config-server:8888

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
